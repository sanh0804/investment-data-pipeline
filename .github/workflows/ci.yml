name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'

jobs:
  unit:
    name: Python ${{ matrix.python }} tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lake.txt
      - name: Install test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python -m pip check
      - name: Run offline unit tests
        run: |
          mkdir -p data
          .venv/bin/python -m pytest -q --junitxml=data/unit-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-python-${{ matrix.python }}
          path: data/unit-results.xml
          if-no-files-found: ignore
          retention-days: 7

  dbt-fixture:
    name: Fresh migrations and dbt reconciliation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      ci_postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: investment_ci
          POSTGRES_USER: ci_runner
          # Ephemeral test service only; no production secret is required.
          POSTGRES_PASSWORD: ci_fixture_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_runner -d investment_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CI_POSTGRES_HOST: 127.0.0.1
      CI_POSTGRES_PORT: '5432'
      CI_POSTGRES_DB: investment_ci
      CI_POSTGRES_USER: ci_runner
      CI_POSTGRES_PASSWORD: ci_fixture_only_password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lake.txt
            requirements-dbt.txt
      - name: Install collector and dbt in separate environments
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          python -m venv .venv-dbt
          .venv-dbt/bin/python -m pip install -r requirements-dbt.txt
          .venv/bin/python -m pip check
          .venv-dbt/bin/python -m pip check
      - name: Build fixture models and reconcile independent totals
        run: .venv/bin/python scripts/verify_ci.py
      - name: Upload reconciliation diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dbt-fixture-results
          path: |
            data/ci-verification/report.json
            data/ci-verification/*.log
            data/ci-verification/*/target/run_results.json
            data/ci-verification/*/target/manifest.json
          if-no-files-found: ignore
          retention-days: 7

  airflow-parse:
    name: Airflow DAG import and contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned Airflow image
        run: docker build -f orchestration/Dockerfile -t investment-airflow-ci .
      - name: Parse production DAG without network or credentials
        run: docker run --rm --network none -e AIRFLOW__CORE__LOAD_EXAMPLES=false -i --entrypoint python investment-airflow-ci < orchestration/check_dag.py
